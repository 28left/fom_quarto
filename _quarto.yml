project:
  type: website
  output-dir: _site

website:
  title: "Math 558 · Foundations of Mathematics"
  sidebar:
    style: "floating"
    search: true
    background: light
    contents:
      - href: index.qmd
        text: Home
      - href: lectures/lec01.qmd
        text: "1 · Some History and Setting the Stage"
      - href: lectures/lec02.qmd
        text: "2 · The Foundational Crisis"
      - href: notes/zfc-as-a-foundation.qmd
        text: "3 · ZFC as a Foundational Theory"
      - href: notes/first-consequences.qmd
        text: "4 · First Consequences of the ZFC Axioms"
      - href: notes/relations-and-functions.qmd
        text: "5 · Relations and Functions"
      - href: notes/ordinals.qmd
        text: "6 · Ordinals"
      - href: notes/recursion.qmd
        text: "7 · Induction and Recursion"
  page-footer:
    left: "Math 558 · Foundations of Mathematics · Penn State"

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
