project:
  type: website
  output-dir: _site

website:
  title: "Math 558 · Foundations of Mathematics"
  reader-mode: true
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - text: "Lecture Slides"
        menu:
          - href: lectures/lec01.qmd
            text: "1 · Some History and Setting the Stage"
          - href: lectures/lec02.qmd
            text: "2 · The Foundational Crisis"
      - text: "Notes"
        menu:
          - href: notes/zfc-as-a-foundation.qmd
            text: "3 · ZFC as a Foundational Theory"
  page-footer:
    left: "Math 558 · Foundations of Mathematics · Penn State"

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    grid:
      body-width: 820px
  revealjs:
    theme: [serif, custom.scss]
    slide-number: c/t
    transition: fade
    incremental: false
    footer: "Math 558 · Foundations of Mathematics"
